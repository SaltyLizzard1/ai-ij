[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-pipeline"
version = "0.1.0"
description = "Turn long-form articles plus an unlabelled camera roll into scheduled, platform-specific social posts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.12",
    "Markdown>=3.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8.0"]

[project.scripts]
social-pipeline = "social_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["social_pipeline*"]

[tool.setuptools.package-data]
social_pipeline = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
